name: Portable checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check shell syntax and isolated regressions
        shell: bash
        run: |
          python_bin="$(command -v python)"
          # Hide optional runner tools; tests supply their own command stubs.
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          /bin/sh -n install.sh
          /bin/sh -n skills/install.sh
          "$python_bin" -m unittest discover -s tests -v
          "$python_bin" skills-local/.codex/skills/create-validated-skill/scripts/run_eval.py --self-test
